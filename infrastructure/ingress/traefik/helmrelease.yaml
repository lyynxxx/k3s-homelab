apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: traefik
spec:
  interval: 30m

  chart:
    spec:
      chart: traefik
      version: "41.6.0"
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: traefik
      interval: 12h

  values:
    providers:
      kubernetesGateway:
        enabled: true

    gateway:
      enabled: false

    service:
      annotations:
        lbipam.cilium.io/ips: "192.168.69.200"
        service.cilium.io/forwarding-mode: "dsr"
      spec:
        type: LoadBalancer
