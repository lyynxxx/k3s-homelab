apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: traefik
  namespace: flux-system
spec:
  interval: 10m

  dependsOn:
    - name: gateway-api

  path: ./infrastructure/ingress/traefik
  prune: true
  wait: true
  timeout: 5m

  sourceRef:
    kind: GitRepository
    name: flux-system
