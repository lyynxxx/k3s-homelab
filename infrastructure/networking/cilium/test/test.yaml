apiVersion: v1
kind: Pod
metadata:
  name: l2-test
  namespace: default
  labels:
    app: l2-test
spec:
  containers:
    - name: web
      image: nginx:alpine
      ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: l2-test
  namespace: default
  annotations:
    lbipam.cilium.io/ips: "192.168.69.200"
spec:
  type: LoadBalancer
  externalTrafficPolicy: Cluster
  selector:
    app: l2-test
  ports:
    - name: http
      port: 80
      targetPort: 80
